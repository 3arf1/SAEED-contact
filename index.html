.hero .word,html[data-theme="light"] .hero .word{filter:brightness(0) invert(1)!important}
.hero>*,.hero h1,.hero p{position:relative;z-index:2}
.hero h1{margin:7px 0 9px}
.hero .label{max-width:100%}
.hero>.label .word{opacity:.94}
.hero p .word{opacity:.91}
.hero:after{display:block!important;content:""!important;position:absolute;top:-114px;inset-inline-end:-88px;width:200px;height:200px;border:7px solid #c29a73;border-radius:50%;box-shadow:0 0 0 2px #f1d8bb80,0 0 0 5px #647d9180;opacity:.96;z-index:1;pointer-events:none}
.hero:before{content:"";position:absolute;bottom:0;inset-inline-start:18px;width:68px;height:3px;background:#c29a73;border-radius:3px 3px 0 0;z-index:3}
html[data-theme="dark"] .hero{border-color:#7894a8!important}
.footer{position:relative}
.footer:before{content:"";position:absolute;top:-1px;left:calc(50% - 26px);width:52px;height:2px;background:#b58f6b;border-radius:2px}
@media(max-width:360px){.hero{min-height:200px!important;padding:18px 13px 17px!important}.hero:before{inset-inline-start:13px}.hero:after{width:166px;height:166px;top:-99px;inset-inline-end:-74px}}

/* SAEED signature copper accents and restrained dotted texture */
html{--dot:rgba(100,125,145,.21);--card-dot:rgba(100,125,145,.15);--copper-signature:#b58f6b;--copper-soft:#b58f6b66}
html[data-theme="dark"]{--dot:rgba(181,143,107,.21);--card-dot:rgba(195,211,223,.13);--copper-signature:#cfa77e;--copper-soft:#cfa77e77}
body:before{display:block!important;content:""!important;position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle,var(--dot) 0.8px,transparent 1.25px) 0 0/13px 13px!important;opacity:1;mask-image:linear-gradient(90deg,#000 0%,#0008 6%,transparent 24%,transparent 76%,#0008 94%,#000 100%);-webkit-mask-image:linear-gradient(90deg,#000 0%,#0008 6%,transparent 24%,transparent 76%,#0008 94%,#000 100%)}
main{position:relative;z-index:1}
header{position:relative;border-bottom-color:var(--line)}
header:after{content:"";position:absolute;inset-inline-start:0;bottom:-1px;width:52px;height:2px;border-radius:2px;background:var(--copper-signature);pointer-events:none}
.hero h1:before{content:"";position:absolute;inset:-11px -5px;z-index:-1;pointer-events:none;background:radial-gradient(circle,#e2b991 0.7px,transparent 1.15px) 0 0/10px 10px;opacity:.16;mask-image:linear-gradient(90deg,#0008,transparent 88%);-webkit-mask-image:linear-gradient(90deg,#0008,transparent 88%)}
html[dir="rtl"] .hero h1:before{mask-image:linear-gradient(270deg,#0008,transparent 88%);-webkit-mask-image:linear-gradient(270deg,#0008,transparent 88%)}
.card{position:relative;isolation:isolate}
.card:before{content:"";position:absolute;inset-block:0;inset-inline-end:0;width:61%;border-radius:inherit;z-index:-1;pointer-events:none;background:radial-gradient(circle,var(--card-dot) .75px,transparent 1.1px) 0 0/11px 11px;mask-image:linear-gradient(270deg,#000 0%,#0009 25%,transparent 95%);-webkit-mask-image:linear-gradient(270deg,#000 0%,#0009 25%,transparent 95%)}
html[dir="rtl"] .card:before{mask-image:linear-gradient(90deg,#000 0%,#0009 25%,transparent 95%);-webkit-mask-image:linear-gradient(90deg,#000 0%,#0009 25%,transparent 95%)}
.section-head:after,html[dir="rtl"] .section-head:after{background:linear-gradient(to right,var(--copper-signature) 0 27px,var(--line) 27px 100%)}
html[dir="rtl"] .section-head:after{background:linear-gradient(to left,var(--copper-signature) 0 27px,var(--line) 27px 100%)}
.theme-toggle{border-color:var(--copper-soft);color:var(--copper)}
.location .direction{border-color:var(--copper-soft)}
.locations .card:last-child{border-inline-start:2px solid var(--copper-signature)}
.footer:before{background:var(--copper-signature)}
@media(max-width:360px){body:before{background-size:11px 11px!important}.card:before{width:54%}}

/* Stronger yet balanced copper and dot detailing */

/* SAEED v18 — compact interactive brochure viewer; existing contact styles retained */
.flyer-card{width:100%;font:inherit;text-align:start;cursor:pointer;border-inline-start:3px solid var(--copper-signature)!important}
.flyer-card .card-copy{display:flex;flex-direction:column;gap:5px}
.flyer-caption{opacity:.86}
#flyer-viewer{box-sizing:border-box;width:min(94vw,720px);max-width:94vw;max-height:94vh;max-height:94dvh;padding:14px;margin:auto;border:1px solid var(--copper-signature);border-radius:17px;background:var(--panel);color:var(--ink);box-shadow:0 24px 80px #0007;overflow:auto;font:inherit}
#flyer-viewer::backdrop{background:rgba(21,20,20,.74);backdrop-filter:blur(4px)}
#flyer-viewer[open]{display:flex;flex-direction:column;gap:10px}
#flyer-viewer .flyer-en,html[lang="en"] #flyer-viewer .flyer-ar{display:none}
html[lang="en"] #flyer-viewer .flyer-en{display:inline}
.flyer-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--copper-signature);padding-bottom:8px}
.flyer-toolbar h2{font-size:18px;margin:0;font-weight:600}
#flyer-viewer button{font:inherit;font-size:13px;color:var(--ink);background:var(--page);border:1px solid var(--line);border-radius:10px;min-height:38px;padding:6px 12px;cursor:pointer;touch-action:manipulation}
#flyer-viewer button:focus-visible,.flyer-card:focus-visible{outline:2px solid var(--copper-signature);outline-offset:2px}
#flyer-viewer .flyer-close{font-size:25px;width:38px;padding:0;line-height:1;flex:none}
.flyer-tabs{display:flex;gap:7px;flex:none}
.flyer-tabs button{flex:1}
#flyer-viewer .flyer-tabs button[aria-pressed="true"]{background:#647d91;color:white;border-color:var(--copper-signature)}
.flyer-stage{direction:ltr;overflow:auto;overscroll-behavior:contain;background:#c6c9cb;padding:7px;border-radius:10px;min-height:80px;max-height:64vh;max-height:64dvh;flex:1;scrollbar-width:thin}
#flyer-page-image{display:block;width:100%;height:auto;max-width:none;background:#fff;border-radius:3px;margin:0 auto;box-shadow:0 2px 8px #0002}
.flyer-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.flyer-zoom{display:flex;align-items:center;gap:7px;direction:ltr}
.flyer-zoom output{font-size:12px;text-align:center;min-width:40px}
#flyer-viewer .flyer-zoom button{min-width:38px;padding:3px 8px;font-size:19px}
#flyer-viewer button:disabled{opacity:.45;cursor:default}
#flyer-download{border-color:var(--copper-signature)!important}
.flyer-status{font-size:12px;color:var(--ink);margin:0}
.flyer-status:empty{display:none}
@media(max-width:360px){#flyer-viewer{padding:10px;gap:8px}#flyer-viewer button{padding:5px 8px}}

/* SAEED v19 — stable full-height viewer, including iOS Safari and QR in-app browsers */
#flyer-viewer{position:fixed;inset:var(--flyer-top,8px) 0 auto 0;margin:0 auto;width:min(96vw,760px);max-width:96vw;height:calc(100vh - 16px);height:calc(100dvh - 16px);height:var(--flyer-height,calc(100dvh - 16px));max-height:none;min-height:0;padding:12px;overflow:hidden}
#flyer-viewer[open]{display:flex;flex-direction:column;gap:8px}
#flyer-viewer .flyer-toolbar,#flyer-viewer .flyer-tabs,#flyer-viewer .flyer-actions,#flyer-viewer .flyer-status{flex:0 0 auto;min-width:0}
#flyer-viewer .flyer-stage{flex:1 1 0%;height:0;min-height:0;max-height:none;width:100%;padding:6px;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#flyer-page-image{display:block;max-width:none;max-height:none;height:auto;width:100%;margin:auto;object-fit:contain}
#flyer-viewer button{min-height:42px}
#flyer-viewer .flyer-close{min-width:42px}
#flyer-viewer .flyer-zoom button{min-width:42px}
@media(max-width:600px){#flyer-viewer{width:calc(100vw - 12px);max-width:calc(100vw - 12px);padding:9px;border-radius:14px;gap:7px}#flyer-viewer .flyer-toolbar h2{font-size:17px}#flyer-viewer .flyer-stage{padding:4px}}
