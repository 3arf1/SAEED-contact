/* SAEED dual appearance: plain background, no photography or decorative pattern */
html{color-scheme:light;background:#f3f6f8;--page:#f3f6f8;--panel:#fff;--panel-hover:#e6edf2;--ink:#243b4d;--line:#b5c6d2;--accent:#647d91;--copper:#9a6946;--icon-bg:#e8eff4;--active:#486478;--rule:#c6d2dc;--shadow:0 3px 14px #263c4d0c}
html[data-theme="dark"]{color-scheme:dark;background:#243b4d;--page:#243b4d;--panel:#304b60;--panel-hover:#395a70;--ink:#fff;--line:#647d91;--accent:#9db5c7;--copper:#e0b58a;--icon-bg:#243b4d;--active:#647d91;--rule:#536e82;--shadow:0 3px 14px #14233030}
html,body{background:var(--page)!important;background-image:none!important;color:var(--ink);min-height:100vh}
body:before,.hero:after{content:none!important;display:none!important}

header{border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:8px 0 20px}

.header-controls{display:flex;align-items:center;justify-content:center;gap:9px;direction:ltr;flex:none;max-width:100%}

.langswitch button[aria-pressed=true]{background:var(--active);box-shadow:none}
